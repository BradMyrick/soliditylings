# Exercises run in the ORDER they appear below: a single flat, linear
# progression from easiest to hardest. Difficulty is expressed only by
# position — there are no section labels by design.
#
# Modes (every exercise is test mode — the learner must make the Foundry
# test contract in the file pass; compiling alone is never enough):
#   test = the learner must make the tests pass.
#
# Every exercise has a solved twin in solutions/ which CI verifies, so the
# curriculum is always solvable. See CONTRIBUTING.md.

# ===== 00 intro =====
[[exercises]]
name = "intro1"
path = "exercises/00_intro/intro1.sol"
mode = "test"
hint = """
Every `{` in Solidity needs its matching `}`. Count the braces in the
file — the contract is never closed. Watch the line number in the
compiler error; it usually points AFTER the actual problem."""

[[exercises]]
name = "intro2"
path = "exercises/00_intro/intro2.sol"
mode = "test"
hint = """
The test tells you exactly what it wants: `returnTrue()` must return
true. Only one literal in that function can change."""

# ===== 01 variables =====
[[exercises]]
name = "variables1"
path = "exercises/01_variables/variables1.sol"
mode = "test"
hint = """
State variable declarations look like `TYPE visibility NAME;` — for
example an unsigned integer that anyone can read. The test reads it
through its automatic getter and expects the uint256 zero value."""

[[exercises]]
name = "variables2"
path = "exercises/01_variables/variables2.sol"
mode = "test"
hint = """
`address` is a built-in 20-byte type — no import needed. Declare it
public so the test's automatic getter `owner()` exists."""

[[exercises]]
name = "variables3"
path = "exercises/01_variables/variables3.sol"
mode = "test"
hint = """
Which keyword tells the compiler a value is fixed at compile time and
never changes? That keyword plus a literal assignment is all you need."""

# ===== 02 functions =====
[[exercises]]
name = "functions1"
path = "exercises/02_functions/functions1.sol"
mode = "test"
hint = """
The order is: `function name() public pure returns (string memory)`.
The body just returns a string literal — don't forget `memory`; string
is a reference type."""

[[exercises]]
name = "functions2"
path = "exercises/02_functions/functions2.sol"
mode = "test"
hint = """
The test calls `increment()` through a low-level call from OUTSIDE the
contract. Which of the four visibilities allows that?"""

[[exercises]]
name = "functions3"
path = "exercises/02_functions/functions3.sol"
mode = "test"
hint = """
`pure` promises the compiler you won't even READ state. `getValue`
reads `value`. One step up the mutability ladder keeps the promise
honest while allowing reads."""

# ===== 03 collections =====
[[exercises]]
name = "arrays1"
path = "exercises/03_collections/arrays1.sol"
mode = "test"
hint = """
A dynamic array of unsigned integers is `uint256[]`. Declaring it
`public` creates a getter that takes an index. Storage arrays grow
with a one-word method call that appends."""

[[exercises]]
name = "mappings1"
path = "exercises/03_collections/mappings1.sol"
mode = "test"
hint = """
The declaration reads like a signature: `mapping(address => uint256)`,
then visibility, then the name. Writing to it is like assigning to an
array at an index: `balances[user] = amount;`."""

[[exercises]]
name = "mappings2"
path = "exercises/03_collections/mappings2.sol"
mode = "test"
hint = """
The value type of a mapping can be another mapping — just replace
`uint256` in the arrow's right side with `mapping(address => uint256)`.
Reads chain the same way they write: `a[b][c]`."""

# ===== 04 advanced types =====
[[exercises]]
name = "structs1"
path = "exercises/04_advanced_types/structs1.sol"
mode = "test"
hint = """
A struct definition lists `TYPE NAME;` fields inside braces, at
contract level. Construct one positionally like a function call:
`User(_username, _score)`."""

[[exercises]]
name = "enums1"
path = "exercises/04_advanced_types/enums1.sol"
mode = "test"
hint = """
`enum State { Pending, Active, Inactive }` numbers its members 0, 1, 2.
Assign with `State.Active` — the member's name prefixed by the type."""

[[exercises]]
name = "errors1"
path = "exercises/04_advanced_types/errors1.sol"
mode = "test"
hint = """
Custom errors are declared at contract level like events, but with the
`error` keyword. To use one, `if` the bad condition and `revert` with
the error name and its argument."""

# ===== 05 contracts =====
[[exercises]]
name = "modifiers1"
path = "exercises/05_contracts/modifiers1.sol"
mode = "test"
hint = """
A modifier is declared with `modifier` instead of `function`, contains
its check, then `_;` where the wrapped body runs. Attach it by name in
the function header after the visibility."""

[[exercises]]
name = "inheritance1"
path = "exercises/05_contracts/inheritance1.sol"
mode = "test"
hint = """
Inheritance is declared with `is`. The parent already says `virtual`,
so the child needs the matching keyword for overrides — and the same
function signature."""

[[exercises]]
name = "interfaces1"
path = "exercises/05_contracts/interfaces1.sol"
mode = "test"
hint = """
An interface has no function bodies and its functions are implicitly
`external`. To call through one, wrap an address in the interface type
like a cast: `IGreeter(target).greet()`."""

# ===== 06 memory =====
[[exercises]]
name = "memory1"
path = "exercises/06_memory/memory1.sol"
mode = "test"
hint = """
Reference-type parameters must name a home: `storage`, `memory`, or
`calldata`. This function only needs the string to exist during the
call — the conventional choice for a copy that dies with the call."""

[[exercises]]
name = "calldata1"
path = "exercises/06_memory/calldata1.sol"
mode = "test"
hint = """
Solidity refuses to convert `memory` to `calldata` — call data cannot
be synthesized. So `processInput`'s parameter must already BE calldata.
Careful: only `external` functions may take calldata parameters."""

# ===== 07 payable =====
[[exercises]]
name = "payable1"
path = "exercises/07_payable/payable1.sol"
mode = "test"
hint = """
One keyword turns a function into an ETH receiver — and the same
keyword would turn an `address` into an `address payable`. Without it,
any attached value reverts the whole call."""

[[exercises]]
name = "receive1"
path = "exercises/07_payable/receive1.sol"
mode = "test"
hint = """
There's a special no-arg, always-payable function that catches empty-
calldata transfers. Its name is a keyword: `receive() external
payable`. Put your counter increment inside it."""

# ===== 08 events =====
[[exercises]]
name = "events1"
path = "exercises/08_events/events1.sol"
mode = "test"
hint = """
Events are declared like structs but with the `event` keyword; `indexed`
goes before the parameter type. Firing one is a single keyword followed
by the event name and arguments."""

# ===== 09 security =====
[[exercises]]
name = "reentrancy1"
path = "exercises/09_security/reentrancy1.sol"
mode = "test"
hint = """
checks → effects → interactions. The external `call` must be the LAST
thing that happens. Ask yourself: if the attacker's receive() ran
again right after the call, what state would it see? Make sure it
already sees a zeroed balance."""

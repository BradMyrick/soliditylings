name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runner:
    name: Build & check runner (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  curriculum:
    name: Verify curriculum (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Structure checks (info.toml <-> exercises/ <-> solutions/)
        run: make check-solved
      - name: Every solution must compile and pass
        run: make verify-solutions
